version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillstreak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillstreak
      POSTGRES_PASSWORD: skillstreak_dev
      POSTGRES_DB: skillstreak_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillstreak -d skillstreak_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillstreak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
