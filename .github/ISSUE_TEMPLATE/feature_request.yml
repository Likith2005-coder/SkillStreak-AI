name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation a learner (or maintainer) runs into today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you'd rule them out.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Learning experience (roadmaps, tutor, quizzes)
        - Gamification (streaks, XP, badges, leaderboard)
        - Ethical Hacking Arsenal
        - Analytics & progress
        - Admin console
        - Developer experience
        - Other
    validations:
      required: true
